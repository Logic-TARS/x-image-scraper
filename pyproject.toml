[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xscrape"
version = "0.1.0"
description = "Download media images from X/Twitter user profiles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "tqdm>=4.66.0",
  "streamlit>=1.30.0",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.40.0",
]
tui = [
  "rich>=13.0.0",
  "questionary>=2.0.0",
  "tomli>=2.0.1; python_version < '3.11'",
]
all = ["xscrape[browser,tui]"]

[project.scripts]
xscrape = "xscrape.cli:main"
xscrape-browser = "xscrape.playwright_cli:main"
xscrape-login = "xscrape.x_login_cli:main"
xscrape-x-search = "xscrape.x_search_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
